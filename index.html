<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Carnet de Voyage</title>
<meta name="description" content="Notre carnet de voyage familial : carte, planning, billets, budget.">
<!-- Installation sur l'écran d'accueil iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- Barre de l'heure opaque (pas de flou iOS 26) : noire en mode sombre, claire sinon -->
<script>
  (function () {
    var s = 'auto';
    try { s = JSON.parse(localStorage.getItem('cdv::scheme')) || 'auto'; } catch (e) {}
    var dark = s === 'dark' || (s === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    try { var t = JSON.parse(localStorage.getItem('cdv::theme')); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    if (dark) document.documentElement.dataset.dark = '1';
    document.write('<meta name="apple-mobile-web-app-status-bar-style" content="' + (dark ? 'black' : 'default') + '">');
    document.write('<meta name="theme-color" content="' + (dark ? '#000000' : '#FFFFFF') + '">');
  })();
</script>
<meta name="apple-mobile-web-app-title" content="Voyage">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=5">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="vendor/fontawesome/css/fontawesome.min.css">
<link rel="stylesheet" href="vendor/fontawesome/css/solid.min.css">
<link rel="stylesheet" href="vendor/fontawesome/css/regular.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"><div class="spinner" style="margin-top:40vh"></div></div>
<noscript>Activez JavaScript pour utiliser Carnet de Voyage.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
